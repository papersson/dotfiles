# TMUX CHEAT SHEET
# =================
# Prefix: Ctrl-a
#
# SESSIONS: Ctrl-a f (sessionizer), tmux ls, Ctrl-a d (detach), Ctrl-a s (switch)
# WINDOWS: Ctrl-a c (new), Ctrl-a n/p (next/prev), Ctrl-a 0-9 (jump)
# PANES: Ctrl-a | (vsplit), Ctrl-a - (hsplit), Ctrl-a h/j/k/l (navigate), Ctrl-a x (kill)
# COPY: Ctrl-a [ (enter), Space (select), Enter (copy), Ctrl-a ] (paste)

# Essential settings
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set-window-option -g mode-keys vi

# Set prefix to Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"  # Split panes horizontally
bind - split-window -v -c "#{pane_current_path}"  # Split panes vertically

# Remove default split panes binding since we replaced them
unbind '"'
unbind %

# Vim style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Ctrl-a + Shift + vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Fine-grained resize with Ctrl-a + Alt + vim keys
bind -r M-h resize-pane -L 1
bind -r M-j resize-pane -D 1
bind -r M-k resize-pane -U 1
bind -r M-l resize-pane -R 1

# Modern colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Clipboard settings
set -g set-clipboard on
set -g allow-passthrough on

# Catppuccin Mocha palette (matching Ghostty theme)
# Base=#1e1e2e Mantle=#181825 Surface0=#313244 Surface1=#45475a
# Text=#cdd6f4 Subtext0=#a6adc8 Overlay0=#6c7086
# Blue=#89b4fa Mauve=#cba6f7 Green=#a6e3a1 Teal=#94e2d5
# Peach=#fab387 Yellow=#f9e2af Red=#f38ba8 Lavender=#b4befe

# Status bar
set -g status-style 'bg=default fg=#cdd6f4'
set -g status-position bottom
set -g status-justify left

# Left side - Session name (mauve pill)
set -g status-left-length 50
set -g status-left '#[fg=#cba6f7,bg=default]#[fg=#1e1e2e,bg=#cba6f7,bold]  #S #[fg=#cba6f7,bg=default]#{?client_prefix, #[fg=#f9e2af]⌨ ,  }'

# Right side
set -g status-right-length 80
set -g status-right '#[fg=#89b4fa,bg=default]#[fg=#1e1e2e,bg=#89b4fa]  %H:%M #[fg=#89b4fa,bg=default] #[fg=#45475a,bg=default]#[fg=#cdd6f4,bg=#45475a]  %d-%b #[fg=#45475a,bg=default]'

# Window status (rounded pills)
set -g window-status-current-format '#[fg=#a6e3a1,bg=default]#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W#{?window_zoomed_flag,  ,} #[fg=#a6e3a1,bg=default]'
set -g window-status-format '#[fg=#313244,bg=default]#[fg=#a6adc8,bg=#313244] #I:#W #[fg=#313244,bg=default]'
set -g window-status-separator ' '

# Display pane numbers
set -g display-panes-time 2000
set -g display-panes-colour '#45475a'
set -g display-panes-active-colour '#89b4fa'

# Pane borders (Catppuccin Mocha)
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'
set -g pane-border-lines single
set -g pane-border-indicators colour

# Dim inactive panes to highlight the active one
set -g window-style 'fg=#6c7086'
set -g window-active-style 'fg=#cdd6f4'

# Message and command prompt styling
set -g message-style 'fg=#cdd6f4 bg=#45475a bold'
set -g message-command-style 'fg=#cdd6f4 bg=#45475a bold'

# Clock mode colors
set -g clock-mode-colour '#89b4fa'
set -g clock-mode-style 24

# Reduce escape time for Neovim
set -sg escape-time 0

# Enable undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Floating scratch terminal (Ctrl-a Space)
bind Space display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Quick reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off
set -g activity-action none

# Window status activity style
set -g window-status-activity-style 'fg=#f9e2af,bg=default,bold'

# Selection colors
set -g mode-style 'fg=#1e1e2e,bg=#f9e2af,bold'

# Status bar refresh interval
set -g status-interval 1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Continuum settings for automatic restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
